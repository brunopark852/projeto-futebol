name: Atualizar jogos ao vivo

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  sync-live:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar cache persistente de jogos ao vivo
        env:
          API_FUTEBOL_KEY: ${{ secrets.API_FUTEBOL_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          set -euo pipefail

          live_json=$(curl --fail --silent --show-error --retry 2 \
            --max-time 30 \
            -H "Authorization: Bearer ${API_FUTEBOL_KEY}" \
            https://api.api-futebol.com.br/v1/ao-vivo)

          cache_response=$(curl --fail --silent --show-error --retry 2 \
            --max-time 15 \
            -H "Authorization: Bearer ${KV_REST_API_TOKEN}" \
            "${KV_REST_API_URL}/get/futebol%3Acache%3Av1")

          cache_json=$(printf '%s' "${cache_response}" | jq -r '.result // empty')
          if [ -z "${cache_json}" ]; then
            echo 'Cache principal ainda não foi criado; sincronização ignorada.' >&2
            exit 1
          fi

          updated_cache=$(jq -c --argjson live "${live_json}" \
            '.aoVivo = $live | .lastUpdated = (now | todateiso8601)' \
            <<< "${cache_json}")

          command=$(jq -cn --arg key 'futebol:cache:v1' --arg value "${updated_cache}" \
            '["SET", $key, $value]')

          curl --fail --silent --show-error --retry 2 \
            --max-time 15 \
            -X POST \
            -H "Authorization: Bearer ${KV_REST_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "${command}" \
            "${KV_REST_API_URL}"
