name: Atualizar jogos ao vivo

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  sync-live:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar cache de jogos ao vivo
        run: |
          curl --fail --silent --show-error --retry 2 \
            --max-time 30 \
            -A 'Mozilla/5.0 (compatible; LiveSync/1.0)' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Referer: https://futebolagora.blog/ao-vivo' \
            --http1.1 \
            -X POST \
            https://futebolagora.blog/api/cron/live
